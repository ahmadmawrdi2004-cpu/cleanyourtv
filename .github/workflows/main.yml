name: Build Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدويًا

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK
      run: |
        cd launcher
        chmod +x build-and-install.sh
        # هذا الأمر يبني ملف APK فقط دون محاولة تثبيته على تلفاز
        ./build-and-install.sh --build-only

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cleanyourtv-launcher
        path: launcher/build/outputs/apk/**/*.apk
